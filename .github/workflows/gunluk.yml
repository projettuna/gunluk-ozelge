name: Özelge bildirimi

on:
  schedule:
    - cron: "7 * * * *"   # her saat başı (+7 dk)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme: e-posta gönderme, kaydetme"
        type: boolean
        default: false
      resend:
        description: "Son 10 özelgeyi yeniden gönder"
        type: boolean
        default: false
      seed:
        description: "Web arşivini son kayıtlarla doldur"
        type: boolean
        default: false
      resend_karar:
        description: "Son 5 VUK 359 kararını yeniden gönder"
        type: boolean
        default: false
      migrate:
        description: "Eski arşivi (feed.json) veritabanına taşı"
        type: boolean
        default: false
      test_push:
        description: "Kayıtlı cihazlara deneme bildirimi gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ozelge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pywebpush==2.0.3
      - name: Özelgeleri ve kararları kontrol et
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          SUPABASE_URL: https://hnolhapzcisavhkwyzhs.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAIL_ENABLED: ${{ vars.MAIL_ENABLED }}
        run: python ozelge.py ${{ inputs.seed && '--seed' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.resend && '--resend' || '' }} ${{ inputs.resend_karar && '--resend-karar' || '' }} ${{ inputs.migrate && '--migrate' || '' }} ${{ inputs.test_push && '--test-push' || '' }}
      - name: Durumu kaydet
        run: |
          [ -f seen.json ] || [ -f docs/feed.json ] || exit 0
          git config user.name "ozelge-bot"
          git config user.email "ozelge-bot@users.noreply.github.com"
          git add seen.json docs/feed.json 2>/dev/null || git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Durumu güncelle"
          git pull --rebase -q
          git push

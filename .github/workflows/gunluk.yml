name: Özelge bildirimi

on:
  schedule:
    # Saatler UTC (Türkiye = UTC+3)
    - cron: "*/5 5-15 * * 1-5"      # hafta içi 08:00-19:00 TR: 5 dakikada bir
    - cron: "7 0-4,16-23 * * 1-5"   # hafta içi diğer saatler: saatte bir
    - cron: "7 * * * 0,6"           # hafta sonu: saatte bir
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme: e-posta gönderme, kaydetme"
        type: boolean
        default: false
      resend:
        description: "Son 10 özelgeyi yeniden gönder"
        type: boolean
        default: false
      seed:
        description: "Web arşivini son kayıtlarla doldur"
        type: boolean
        default: false
      resend_karar:
        description: "Son 5 VUK 359 kararını yeniden gönder"
        type: boolean
        default: false
      migrate:
        description: "Eski arşivi (feed.json) veritabanına taşı"
        type: boolean
        default: false
      diag:
        description: "Veritabanı teşhis (yalnızca sayılar)"
        type: boolean
        default: false
      relay_check:
        description: "Bildirim aktarıcısını kontrol et"
        type: boolean
        default: false
      chat_test:
        description: "Sohbet uçtan uca testi"
        type: boolean
        default: false
      test_push:
        description: "Kayıtlı cihazlara deneme bildirimi gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ozelge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pywebpush==2.0.3
      - name: Özelgeleri ve kararları kontrol et
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          SUPABASE_URL: https://hnolhapzcisavhkwyzhs.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAIL_ENABLED: ${{ vars.MAIL_ENABLED }}
        run: |
          if [ "${{ inputs.relay_check }}" = "true" ]; then
            echo "site: $(curl -s -o /dev/null -w '%{http_code}' https://tmpro.tmproapp.workers.dev/)"
            echo "relay bos: $(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://tmpro.tmproapp.workers.dev/api/push)"
            echo "relay 0 abone: $(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: application/json' -d '{"vapid":{"private":"x","public":"y"},"subs":[]}' https://tmpro.tmproapp.workers.dev/api/push)"
            exit 0
          fi
          if [ "${{ inputs.chat_test }}" = "true" ]; then SUPABASE_PUBLISHABLE_KEY=sb_publishable_tlfwqtscxxv2vdSHe3PstQ_XO1db8p9 python tools/chat_test.py; exit 0; fi
          python ozelge.py ${{ inputs.seed && '--seed' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.resend && '--resend' || '' }} ${{ inputs.resend_karar && '--resend-karar' || '' }} ${{ inputs.migrate && '--migrate' || '' }} ${{ inputs.test_push && '--test-push' || '' }} ${{ inputs.diag && '--diag' || '' }}
      - name: Durumu kaydet
        run: |
          [ -f seen.json ] || [ -f docs/feed.json ] || exit 0
          git config user.name "ozelge-bot"
          git config user.email "ozelge-bot@users.noreply.github.com"
          git add seen.json docs/feed.json 2>/dev/null || git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Durumu güncelle"
          git pull --rebase -q
          git push

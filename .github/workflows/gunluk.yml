name: Günlük özelge bildirimi

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 Türkiye
  workflow_dispatch:
    inputs:
      debug:
        description: "Ham yanıtları kaydet (debug)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Özelgeleri kontrol et ve gönder
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          KEYWORDS: ${{ vars.KEYWORDS }}
        run: python ozelge.py ${{ inputs.debug && '--debug' || '' }}
      - name: Debug çıktısını yükle
        if: always() && inputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
      - name: Görülen özelgeleri kaydet
        run: |
          git config user.name "ozelge-bot"
          git config user.email "ozelge-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Görülen özelgeleri güncelle"
          git push

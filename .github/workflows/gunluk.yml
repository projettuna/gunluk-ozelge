name: Özelge bildirimi
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.auto != '' && 'Özelge bildirimi (otomatik)' || 'Özelge bildirimi' }}

on:
  schedule:
    # Saatler UTC (Türkiye = UTC+3)
    - cron: "*/5 5-15 * * 1-5"      # hafta içi 08:00-19:00 TR: 5 dakikada bir
    - cron: "7 0-4,16-23 * * 1-5"   # hafta içi diğer saatler: saatte bir
    - cron: "7 * * * 0,6"           # hafta sonu: saatte bir
    - cron: "*/5 21 * * *"          # her gece 00:00-01:00 TR: yalnızca Resmî Gazete, 5 dakikada bir
  workflow_dispatch:
    inputs:
      auto:
        description: "Zamanlayıcıdan (Cloudflare) otomatik tur: boş = normal, rg = yalnızca Resmî Gazete"
        type: string
        default: ""
      yorum_limit:
        description: "Bu turda yazılacak Müfettiş Notu sayısı (eski kayıtlar için)"
        required: false
      metin_limit:
        description: "Bu turda doldurulacak tam metin sayısı (eski kayıtlar için)"
        required: false
        default: ""
      dry_run:
        description: "Deneme: e-posta gönderme, kaydetme"
        type: boolean
        default: false
      resend:
        description: "Son 10 özelgeyi yeniden gönder"
        type: boolean
        default: false
      seed:
        description: "Web arşivini son kayıtlarla doldur"
        type: boolean
        default: false
      resend_karar:
        description: "Son 5 VUK 359 kararını yeniden gönder"
        type: boolean
        default: false
      migrate:
        description: "Eski arşivi (feed.json) veritabanına taşı"
        type: boolean
        default: false
      diag:
        description: "Veritabanı teşhis (yalnızca sayılar)"
        type: boolean
        default: false
      relay_check:
        description: "Bildirim aktarıcısını kontrol et"
        type: boolean
        default: false
      chat_test:
        description: "Sohbet uçtan uca testi"
        type: boolean
        default: false
      ictihat_test:
        description: "İçtihat yönü ucunu dene (true) / Emsal Bul testi (emsal) / kurulum kontrolü (kontrol)"
        type: string
        default: ""
      taslak_test:
        description: "Emsal Bul uçtan uca testi (geçici kullanıcı)"
        type: boolean
        default: false
      ayar:
        description: "Fiyat ayarı (ör. fiyat=179,fiyat_yil=1790)"
        type: string
        default: ""
      madde_cek:
        description: "Kanun maddelerini mevzuat.gov.tr'den al (rapor taslağı için)"
        type: boolean
        default: false
      test_push:
        description: "Kayıtlı cihazlara deneme bildirimi gönder"
        type: boolean
        default: false
      remind_test:
        description: "Takvim hatırlatıcısını saatini beklemeden şimdi çalıştır (yalnızca 3 gün / 1 gün sonrası olan günler)"
        type: boolean
        default: false
      weekly_test:
        description: "Haftalık özet: şimdi yalnızca yöneticilere deneme gönder"
        type: boolean
        default: false
      morning_test:
        description: "Günaydın bildirimi: önizleme + yöneticilere deneme"
        type: boolean
        default: false
      morning_all:
        description: "Günaydın bildirimini şimdi tüm üyelere gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ozelge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pywebpush==2.0.3 pypdf==5.1.0
      - name: Özelgeleri ve kararları kontrol et
        env:
          TMPRO_AUTO: ${{ inputs.auto != '' && '1' || '' }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METIN_LIMIT: ${{ inputs.metin_limit }}
          YORUM_LIMIT: ${{ inputs.yorum_limit }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          SUPABASE_URL: https://hnolhapzcisavhkwyzhs.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAIL_ENABLED: ${{ vars.MAIL_ENABLED }}
        run: |
          if [ "${{ inputs.relay_check }}" = "true" ]; then
            echo "site: $(curl -s -o /dev/null -w '%{http_code}' https://tmpro.tmproapp.workers.dev/)"
            echo "relay bos: $(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://tmpro.tmproapp.workers.dev/api/push)"
            echo "relay 0 abone: $(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: application/json' -d '{"vapid":{"private":"x","public":"y"},"subs":[]}' https://tmpro.tmproapp.workers.dev/api/push)"
            exit 0
          fi
          if [ "${{ inputs.morning_test }}" = "true" ] || [ "${{ inputs.morning_all }}" = "true" ]; then
            echo "Önizleme (örnek kullanıcılar):"
            curl -s -X POST -H 'Content-Type: application/json' -d '{"preview":true,"users":[{"name":"Deneme Kullanıcı","lat":39.93,"lon":32.86,"city":"Ankara","events":["Örnek Gün"]},{"name":"Deneme","lat":41.01,"lon":28.98,"city":"İstanbul"},{"name":"Deneme","lat":39.9,"lon":41.27,"city":"Erzurum"}]}' https://tmpro.tmproapp.workers.dev/api/morning
            echo; echo "Yöneticilere deneme (kişi sayısı):"
            AUTH=""; case "$SUPABASE_SERVICE_KEY" in eyJ*) AUTH="Authorization: Bearer $SUPABASE_SERVICE_KEY";; esac
            echo "konumu kayıtlı üye sayısı: $(curl -s "$SUPABASE_URL/rest/v1/profiles?select=id&wx_city=not.is.null" -H "apikey: $SUPABASE_SERVICE_KEY" ${AUTH:+-H "$AUTH"} | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')"
            curl -s -w ' %{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/send_morning" -H "apikey: $SUPABASE_SERVICE_KEY" ${AUTH:+-H "$AUTH"} -H 'Content-Type: application/json' -d '{"test":${{ inputs.morning_all && 'false' || 'true' }}}'
            echo; exit 0
          fi
          if [ -n "${{ inputs.ayar }}" ]; then AYAR="${{ inputs.ayar }}" python tools/ayar.py; exit 0; fi
          if [ "${{ inputs.madde_cek }}" = "true" ]; then python tools/madde_cek.py; exit 0; fi
          if [ "${{ inputs.ictihat_test }}" = "kontrol" ]; then SUPABASE_PUBLISHABLE_KEY=x KONTROL=1 python tools/taslak_test.py; exit 0; fi
          if [ "${{ inputs.ictihat_test }}" = "arsiv_uye" ]; then SUPABASE_PUBLISHABLE_KEY=sb_publishable_tlfwqtscxxv2vdSHe3PstQ_XO1db8p9 YALNIZ_ARSIV=1 python tools/taslak_test.py; exit 0; fi
          if [ "${{ inputs.ictihat_test }}" = "kayit_push" ]; then python tools/kayit_push_test.py; exit 0; fi
          if [ "${{ inputs.ictihat_test }}" = "bildirim" ]; then python tools/bildirim_tani.py; exit 0; fi
          if [ "${{ inputs.ictihat_test }}" = "emsal" ]; then SUPABASE_PUBLISHABLE_KEY=sb_publishable_tlfwqtscxxv2vdSHe3PstQ_XO1db8p9 python tools/taslak_test.py; exit 0; fi
          if [ "${{ inputs.ictihat_test }}" = "true" ]; then SUPABASE_PUBLISHABLE_KEY=sb_publishable_tlfwqtscxxv2vdSHe3PstQ_XO1db8p9 ICTIHAT=1 python tools/taslak_test.py; exit 0; fi
          if [ "${{ inputs.taslak_test }}" = "true" ]; then SUPABASE_PUBLISHABLE_KEY=sb_publishable_tlfwqtscxxv2vdSHe3PstQ_XO1db8p9 python tools/taslak_test.py; exit 0; fi
          if [ "${{ inputs.chat_test }}" = "true" ]; then SUPABASE_PUBLISHABLE_KEY=sb_publishable_tlfwqtscxxv2vdSHe3PstQ_XO1db8p9 python tools/chat_test.py; exit 0; fi
          python ozelge.py ${{ inputs.seed && '--seed' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.resend && '--resend' || '' }} ${{ inputs.resend_karar && '--resend-karar' || '' }} ${{ inputs.migrate && '--migrate' || '' }} ${{ inputs.test_push && '--test-push' || '' }} ${{ inputs.diag && '--diag' || '' }} ${{ inputs.weekly_test && '--weekly-test' || '' }} ${{ inputs.remind_test && '--remind-test' || '' }} ${{ (github.event.schedule == '*/5 21 * * *' || inputs.auto == 'rg') && '--only-rg' || '' }}
      - name: Durumu kaydet
        run: |
          if [ "${{ inputs.madde_cek }}" = "true" ]; then
            git config user.name "ozelge-bot"; git config user.email "ozelge-bot@users.noreply.github.com"
            git add worker/maddeler.json 2>/dev/null; git diff --cached --quiet && exit 0
            git commit -m "Kanun maddeleri güncellendi (rapor taslağı)"; git pull --rebase -q; git push; exit 0
          fi
          [ -f seen.json ] || [ -f docs/feed.json ] || exit 0
          git config user.name "ozelge-bot"
          git config user.email "ozelge-bot@users.noreply.github.com"
          git add seen.json docs/feed.json 2>/dev/null || git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Durumu güncelle"
          git pull --rebase -q
          git push
